<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autoconstrucción · Tablero para compartir</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#F2F1EC;--panel:#FBFAF7;--panel2:#FFFFFF;--ink:#1B1E20;--ink2:#5C5F61;--ink3:#8A8C8A;
 --line:#DAD7CE;--line2:#EAE8E1;--slate:#2F5063;--slate2:#5B7C8E;--slate3:#9DB4BF;--slate4:#CBD9E0;
 --brick:#A6432E;--brick2:#C4715C;--brick3:#E0B3A6;--gold:#B98A2E;--moss:#5E7346;--moss2:#8CA06F;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
h1,h2,h3,.fig{font-family:Archivo,sans-serif} a{color:var(--slate)}
header{border-bottom:1.5px solid var(--ink);padding:26px 0 16px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:0;line-height:1.05}
h1 span{display:block;font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:.02em;margin-top:5px}
.meta{text-align:right;font-size:12px;color:var(--ink2);line-height:1.6}
.meta b{font-family:Archivo;font-weight:700;color:var(--ink)}
.snap{display:inline-block;margin-top:4px;padding:2px 8px;border:1px solid var(--line);border-radius:2px;background:var(--panel);font-size:11px;color:var(--ink3)}
.snap.live{border-color:var(--moss2);color:var(--moss)}
.srcbtns{margin-top:7px;display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.btn{cursor:pointer;padding:4px 10px;border:1px solid var(--line);border-radius:2px;background:var(--panel);font-size:11px;color:var(--ink2);font-weight:600}
.btn:hover{border-color:var(--slate2);color:var(--ink)}
.btn.on{border-color:var(--slate);background:var(--slate);color:#fff}
.btn.on:hover{color:#fff;border-color:var(--slate)}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--line)}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flabel{font-size:11px;color:var(--ink3);font-weight:600;letter-spacing:.03em;min-width:50px}
.chip{cursor:pointer;user-select:none;padding:5px 11px;border:1px solid var(--line);border-radius:2px;background:var(--panel);font-size:12px;color:var(--ink2);font-weight:500;display:inline-flex;gap:7px;align-items:center;transition:.12s}
.chip .dot{width:9px;height:9px;border-radius:1px;background:var(--slate)}
.chip[data-on="0"]{opacity:.4;background:transparent}.chip[data-on="0"] .dot{background:var(--ink3)}
.chip:hover{border-color:var(--slate2)} .chip .n{font-family:Archivo;font-weight:700;color:var(--ink);font-size:11px}
.chip.t .dot{border-radius:50%}
select{padding:5px 9px;border:1px solid var(--line);border-radius:2px;background:var(--panel);font-size:12px;color:var(--ink2);font-family:inherit}
nav.tabs{display:flex;gap:2px;margin:18px 0 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{cursor:pointer;padding:9px 15px;font-family:Archivo;font-weight:600;font-size:13.5px;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink2)} .tab[data-on="1"]{color:var(--ink);border-bottom-color:var(--brick)}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}
@media(max-width:820px){.g2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px 17px;margin-bottom:16px}
.card h3{margin:0 0 3px;font-size:14px;font-weight:700;letter-spacing:-.005em}
.card .sub{font-size:11.5px;color:var(--ink3);margin:0 0 14px;line-height:1.4}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:15px;position:relative;overflow:hidden}
.kpi .v{font-family:Archivo;font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em}
.kpi .l{font-size:11.5px;color:var(--ink2);margin-top:7px;font-weight:500;line-height:1.3}
.kpi .base{font-size:10.5px;color:var(--ink3);margin-top:5px}
.kpi.alert .v{color:var(--brick)} .kpi.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brick)}
.kpi.good .v{color:var(--moss)} .kpi.good::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--moss)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:170px 1fr 64px;align-items:center;gap:10px}
.bar .bl{font-size:12px;color:var(--ink2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bl small{display:block;color:var(--ink3);font-size:10px;font-weight:400}
.track{height:20px;background:var(--line2);border-radius:2px;overflow:hidden}
.fill{height:100%;border-radius:2px 0 0 2px;transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar .bv{font-family:Archivo;font-weight:700;font-size:13px;text-align:right}
.bar .bv small{color:var(--ink3);font-weight:500;font-size:11px}
.stack{display:flex;flex-direction:column;gap:9px}
.srow{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:10px}
.srow .bl{font-size:12px;color:var(--ink2);font-weight:500}.srow .bl small{display:block;color:var(--ink3);font-size:10px}
.seg{height:22px;display:flex;border-radius:2px;overflow:hidden;background:var(--line2)}.seg span{height:100%;transition:width .5s;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--line2)}
.legend i{display:inline-flex;gap:6px;align-items:center;font-size:11px;color:var(--ink2);font-style:normal}
.legend i b{width:11px;height:11px;border-radius:2px;display:inline-block}
.note{font-size:11px;color:var(--ink3);margin-top:12px;line-height:1.5}
.cohbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:2px 0 15px}
table.map{width:100%;border-collapse:collapse;font-size:12.5px}
table.map th{text-align:left;font-family:Archivo;font-weight:600;font-size:11px;color:var(--ink3);padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
table.map td{padding:5px 8px;border-bottom:1px solid var(--line2)}table.map tr:hover td{background:var(--panel2)}
table.map .n{font-family:Archivo;font-weight:700;color:var(--ink2);text-align:right}
.tag{display:inline-block;padding:1px 7px;border-radius:2px;font-size:10.5px;font-weight:500}
.tag.v{background:#EADFE8;color:#7a4d70}.tag.a{background:#E2E9DE;color:#4a6340}
.wip{background:var(--panel);border:1px dashed var(--line);border-radius:3px;padding:30px;text-align:center;color:var(--ink3)}
.wip h3{color:var(--ink2);margin:0 0 8px}.wip p{max-width:540px;margin:0 auto;font-size:12.5px;line-height:1.6}
.loading{padding:60px;text-align:center;color:var(--ink3);font-size:13px}
.err{background:#FBEFEC;border:1px solid var(--brick3);border-radius:3px;padding:18px;color:var(--brick);font-size:12.5px;line-height:1.6}
.pill{display:inline-block;font-family:Archivo;font-weight:700;font-size:11px;padding:2px 8px;border-radius:2px;margin-left:6px}
.pill.c1{background:#E2E9DE;color:#4a6340}.pill.c2{background:#F3E8CE;color:#8a6a1e}.pill.c3{background:#F6E1DB;color:#9a3d28}
#fabFilters{position:fixed;right:18px;bottom:18px;z-index:60;display:none;cursor:pointer;background:var(--slate);color:#fff;border-radius:22px;padding:10px 15px;font-family:Archivo;font-weight:700;font-size:13px;box-shadow:0 3px 12px rgba(0,0,0,.22);align-items:center;gap:7px}
#fabFilters.show{display:inline-flex}
#floatPanel{position:fixed;right:18px;bottom:64px;z-index:61;display:none;width:min(680px,92vw);max-height:74vh;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:4px 16px 16px}
#floatPanel.show{display:block}
#floatPanel .fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;position:sticky;top:0;background:var(--panel2);padding:10px 0 6px;border-bottom:1px solid var(--line2)}
#floatPanel .fhead b{font-family:Archivo;font-size:14px}
#floatPanel .fclose{cursor:pointer;color:var(--ink2);font-size:22px;line-height:1;padding:0 4px}
#floatFilters .frow:first-child{padding-top:4px}
</style></head>

function tenCol(key){return COLS.find(c=>c.startsWith("terreno_documentacion/")&&c.includes(key));}

function buildRecord(r){
  const raw=(r["barrio_renabap"]||"");
  const m=String(raw).match(/\(ID:(\d+)\)/);
  if(!m) return null;
  const info=MARCO[m[1]]; if(!info) return null;
  const estrato=AREA2E[info.e]; if(!estrato) return null;
  const cm=calmat(r["vivienda_pared_material"],r["vivienda_piso_material"],r["vivienda_techo_exterior_material"]);
  const mat = ["IV","V"].includes(cm)?"Irrecuperable":["II","III"].includes(cm)?"Recuperable":cm==="I"?"Adecuada":null;
  const san = !!(r["agua_acceso_tipo"]==="Por cañería, dentro de la vivienda" && String(r["banio_descarga"]||"").startsWith("Inodoro con botón") && SAN_OK.has(r["banio_desague"]) && r["banio"]!=="No tiene baño");
  const per=cn(r["vivienda_personas"]), cua=cn(r["ambientes_totales"]);
  const ratio=(per&&cua&&cua>0)?per/cua:null;
  const hac = ratio==null?"s/d":ratio>3?"Crítico (>3)":ratio>2?"Medio (2–3)":"Sin hacinamiento";
  const hacCrit = ratio!=null && ratio>3;
  const fam=cn(r["vivienda_familias"]); const cohab = fam!=null && fam>1;
  const dims=[];
  if(mat==="Irrecuperable")dims.push("Materialidad irrecuperable");
  if(cohab)dims.push("Cohabitación");
  if(mat==="Recuperable")dims.push("Materialidad recuperable");
  if(!san)dims.push("Saneamiento inadecuado");
  if(hacCrit)dims.push("Hacinamiento crítico");
  const cuanti=(mat==="Irrecuperable")||cohab, cuali=(mat==="Recuperable")||(!san)||hacCrit;
  const deficit = cuanti?"Cuantitativo":cuali?"Cualitativo":"Sin déficit";
  // tenencia
  let best=[-1,"Sin dato"];
  for(const [k,rk,lbl] of TEN_RANK){const c=tenCol(k); if(c&&isChecked(r[c])&&rk>best[0])best=[rk,lbl];}
  const okY=y=>(y!=null&&y>=1900&&y<=2026);
  const antigRaw=cn(r["terreno_vivienda_antiguedad"]), mudRaw=cn(r["terreno_vivienda_mudanza"]);
  const hitos={}; for(const [k] of HITOS_ALL){const y=cn(r["vivienda_mejora_"+k+"_anio"]); if(okY(y))hitos[k]=y;}
  const oe=r["terreno_vivienda_original_estructura"];
  const origen = oe==="Terreno pelado, sin nada construido" ? "De cero"
    : ["Terreno con piezas o construcción precaria habitable (sin baño o cocina)","Casa parcialmente construida (con baño y cocina)","Casa ya construida y habitable"].includes(oe) ? "Ya tenía algo"
    : "s/d";
  const ex=BARRIO_EXTRA[m[1]]||null;
  const antig = ex&&ex[0]>=0 ? ANTIG[ex[0]] : "s/d";
  const tam = ex&&ex[1]>=0 ? TAMANO[ex[1]] : "s/d";
  return {id:r["_id"]||m[1], estrato, tipo:TIPO2[info.t]||"—", partido:info.p, barrio:info.b, origen, antig, tam,
    calmat:cm, mat, san_ade:san, hac, hac_crit:hacCrit, cohab, dims, ndims:dims.length, deficit,
    ten:best[1], ten_rank:best[0],
    antig_anio:okY(antigRaw)?antigRaw:null, mudanza_anio:okY(mudRaw)?mudRaw:null, hitos,
    __fam:fam, __raw:r,
    obrasTL:Object.fromEntries(TL_HITOS.map(h=>[h.key,{estado:r[h.est]||null, ano:okY(cn(r[h.ano]))?cn(r[h.ano]):null}]))};
}

function obraElapsed(r, key){
  const o=r.obrasTL[key]; if(!o||r.antig_anio==null) return null;
  if(o.estado==="Ya estaba al llegar") return r.mudanza_anio!=null ? r.mudanza_anio-r.antig_anio : null;
  if(o.estado==="Lo hicimos") return o.ano!=null ? o.ano-r.antig_anio : null;
  return null; // "Todavía no", NS/NC o sin dato
}

function pct(n,d){return d>0?Math.round(n/d*1000)/10:0;}
// --- ponderación: w=1 en crudo, w=r.w en ponderado ---
function wval(r){return WMODE?(r.w||1):1;}
function wsum(rows){return WMODE?rows.reduce((a,r)=>a+(r.w||1),0):rows.length;}
function fmtW(x){return (typeof x==="number"&&!Number.isInteger(x))?Math.round(x):x;}
function countBy(rows,fn){const m={};rows.forEach(r=>{const k=fn(r);if(k==null)return;m[k]=(m[k]||0)+wval(r);});return m;}
// --- helpers de series temporales ---
function densify(obj){const ys=Object.keys(obj).map(Number);if(!ys.length)return [];const y0=Math.min(...ys),y1=Math.max(...ys);const a=[];for(let y=y0;y<=y1;y++)a.push([y,obj[y]||0]);return a;}
function movMedian(dense,win){const h=(win-1)/2;return dense.map((p,i)=>{const s=[];for(let k=-h;k<=h;k++){const q=dense[i+k];if(q)s.push(q[1]);}s.sort((a,b)=>a-b);const m=s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2;return [p[0],Math.round(m*10)/10];});}
function quinqPts(obj){const m={};Object.keys(obj).forEach(y=>{y=+y;const b=y>=2024?2024:Math.floor(y/5)*5;m[b]=(m[b]||0)+obj[y];});return Object.keys(m).map(Number).sort((a,b)=>a-b).map(b=>b===2024?[2025,m[b]]:b===2020?[2021.5,m[b]]:[b+2,m[b]]);} // punto en el centro del quinquenio; 2024-26 = tramo parcial (Milei), 2020-23 recortado
function heapIndex(obj){let tot=0,r0=0;Object.keys(obj).forEach(y=>{const v=obj[y];tot+=v;if(+y%5===0)r0+=v;});return tot?Math.round(r0/tot*1000)/10:0;} // % de obra en años terminados en 0/5 (esperable ~20%)

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function kpi(v,l,base,cls){v=fmtW(v);return `<div class="kpi ${cls||""}"><div class="v">${v}</div><div class="l">${l}</div>${base?`<div class="base">${base}</div>`:""}</div>`;}
function barChart(title,sub,data,opt){opt=opt||{};const max=opt.max||Math.max(1,...data.map(d=>d.value));
  const rows=data.map(d=>{const w=Math.round(d.value/max*100);const col=d.color||"var(--slate)";
    const rv=opt.pctOf?`${fmtW(d.value)} <small>${pct(d.value,opt.pctOf)}%</small>`:fmtW(d.value);
    return `<div class="bar"><div class="bl">${esc(d.label)}${d.sub?`<small>${esc(d.sub)}</small>`:""}</div><div class="track"><div class="fill" style="width:${w}%;background:${col}"></div></div><div class="bv">${rv}</div></div>`;}).join("");
  return `<div class="card"><h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:""}<div class="bars">${rows}</div>${opt.note?`<div class="note">${opt.note}</div>`:""}</div>`;}
function stackCard(title,sub,rows,legend,note){
  const body=rows.map(r=>{const tot=r.segs.reduce((a,s)=>a+s.v,0)||1;
    const segs=r.segs.map(s=>`<span style="width:${s.v/tot*100}%;background:${s.color}" title="${esc(s.label)}: ${fmtW(s.v)}"></span>`).join("");
    return `<div class="srow"><div class="bl">${esc(r.label)}${r.sub?`<small>${esc(r.sub)}</small>`:""}</div><div class="seg">${segs}</div></div>`;}).join("");
  const leg=legend?`<div class="legend">${legend.map(l=>`<i><b style="background:${l.color}"></b>${esc(l.label)}</i>`).join("")}</div>`:"";
  return `<div class="card"><h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:""}<div class="stack">${body}</div>${leg}${note?`<div class="note">${note}</div>`:""}</div>`;}

function cohabVal(r){const f=r.__fam; if(f==null)return null; return f<=1?"1 familia":f===2?"2 familias":"3 o más familias";}
function deficitPreguntas(rows){

      else { v=r.__raw ? r.__raw[q.campo] : null; v=(v==null||v==="")?null:String(v); }

}

function svgLineChart(title,sub,series,opt){
  opt=opt||{};
  const W=720,H=300,mL=42,mR=14,mT=14,mB=40;
  const ys=[]; series.forEach(s=>s.pts.forEach(p=>ys.push(p[0])));
  const xMin=opt.xMin!=null?opt.xMin:Math.min(...ys), xMax=opt.xMax!=null?opt.xMax:Math.max(...ys);
  let yMax=opt.yMax!=null?opt.yMax:Math.max(1,...series.map(s=>Math.max(0,...s.pts.map(p=>p[1]))));
  const q=yMax>20?5:yMax>8?2:1; yMax=Math.max(q,Math.ceil(yMax/q)*q);
  const px=x=>mL+(x-xMin)/((xMax-xMin)||1)*(W-mL-mR);
  const py=v=>H-mB-v/yMax*(H-mT-mB);
  let g="";
  for(let i=0;i<=4;i++){const vv=yMax*i/4,Y=py(vv);
    g+=`<line x1="${mL}" y1="${Y.toFixed(1)}" x2="${W-mR}" y2="${Y.toFixed(1)}" stroke="var(--line2)"/>`;
    g+=`<text x="${mL-6}" y="${(Y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--ink3)">${Math.round(vv)}</text>`;}
  const step=(xMax-xMin)>40?10:5;
  for(let yr=Math.ceil(xMin/step)*step;yr<=xMax;yr+=step){const X=px(yr);
    g+=`<line x1="${X.toFixed(1)}" y1="${mT}" x2="${X.toFixed(1)}" y2="${H-mB}" stroke="var(--line2)" stroke-width=".5"/>`;
    g+=`<text x="${X.toFixed(1)}" y="${H-mB+15}" text-anchor="middle" font-size="10" fill="var(--ink3)">${yr}</text>`;}
  // franja sombreada (zona no interpretable, p.ej. años truncados)
  if(opt.shade){const xa=px(Math.max(xMin,opt.shade[0])),xb=px(Math.min(xMax,opt.shade[1]));
    if(xb>xa) g=`<rect x="${xa.toFixed(1)}" y="${mT}" width="${(xb-xa).toFixed(1)}" height="${(H-mB-mT).toFixed(1)}" fill="var(--ink3)" opacity=".10"/>`+g;}
  // líneas verticales de contexto macro
  let vlines="";
  if(opt.vlines){opt.vlines.forEach(v=>{if(v.x<xMin||v.x>xMax)return;const X=px(v.x);
    vlines+=`<line x1="${X.toFixed(1)}" y1="${mT+11}" x2="${X.toFixed(1)}" y2="${H-mB}" stroke="${v.color||'var(--ink3)'}" stroke-width="1" stroke-dasharray="3 3" opacity=".65"/>`;
    vlines+=`<text x="${X.toFixed(1)}" y="${mT+8}" text-anchor="middle" font-size="8.5" fill="${v.color||'var(--ink3)'}">${esc(v.label)}</text>`;});}
  let paths="";
  series.forEach(s=>{const pts=s.pts.filter(p=>p[0]>=xMin&&p[0]<=xMax).sort((a,b)=>a[0]-b[0]);
    if(!pts.length)return;
    const d=pts.map((p,i)=>(i?"L":"M")+px(p[0]).toFixed(1)+" "+py(p[1]).toFixed(1)).join(" ");
    paths+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||1.6}" ${s.dash?`stroke-dasharray="6 4" opacity=".9" `:""}stroke-linejoin="round" stroke-linecap="round"/>`;});
  if(opt.labels){series.forEach(s=>{if(s.noLabel)return;const pts=s.pts.filter(p=>p[0]>=xMin&&p[0]<=xMax);
    pts.forEach(p=>{paths+=`<circle cx="${px(p[0]).toFixed(1)}" cy="${py(p[1]).toFixed(1)}" r="2.3" fill="${s.color}"/>`;});
    let lab=pts; if(opt.labelMode==="peak"){const mx=Math.max(0,...pts.map(p=>p[1]));lab=pts.filter(p=>p[1]===mx).slice(0,1);}
    lab.forEach(p=>{if(p[1]>0)paths+=`<text x="${px(p[0]).toFixed(1)}" y="${(py(p[1])-5).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="${s.color}">${p[1]}</text>`;});});}
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet">${g}<line x1="${mL}" y1="${H-mB}" x2="${W-mR}" y2="${H-mB}" stroke="var(--line)"/>${vlines}${paths}</svg>`;
  const leg=opt.legend===false?"":`<div class="legend">${series.map(s=>`<i><b style="background:${s.color}"></b>${esc(s.name)}</i>`).join("")}</div>`;
  return `<div class="card"><h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:""}${svg}${leg}${opt.note?`<div class="note">${opt.note}</div>`:""}</div>`;
}
function svgTimeline(title,sub,markers,opt){
  opt=opt||{};
  const W=720,mL=26,mR=30,laneH=30,charW=5.3,topPad=14;
  const maxY=Math.max(1,opt.max||0,...markers.map(m=>m.years));
  const px=y=>mL+y/maxY*(W-mL-mR);
  const MC=["var(--moss)","var(--gold)","var(--brick)","var(--slate)","var(--slate2)","var(--brick2)","var(--moss2)","var(--ink2)"];
  // asignación de carriles (greedy, de izquierda a derecha) para que las etiquetas no se pisen
  const lane=new Array(markers.length).fill(0), laneRight=[];
  markers.map((m,i)=>i).sort((a,b)=>markers[a].years-markers[b].years).forEach(i=>{
    const m=markers[i];
    const subt=m.sub!=null?m.sub:(m.years.toFixed(1)+" años · n="+m.n);
    const w=Math.max(String(m.label).length,String(subt).length)*charW;
    const X=px(m.years), anc=X<76?"start":X>(W-76)?"end":"middle";
    const lo=(anc==="start"?X:anc==="end"?X-w:X-w/2)-7, hi=(anc==="start"?X+w:anc==="end"?X:X+w/2)+7;
    let L=0; while(L<laneRight.length && lo<laneRight[L]) L++;
    lane[i]=L; laneRight[L]=hi;
  });
  const nLanes=Math.max(1,...lane.map(l=>l+1));
  const baseY=topPad+26+(nLanes-1)*laneH, H=baseY+34;
  let s=`<line x1="${mL}" y1="${baseY}" x2="${W-mR}" y2="${baseY}" stroke="var(--slate)" stroke-width="2"/>`;
  const tstep=maxY>12?5:maxY>6?2:1;
  for(let y=0;y<=Math.ceil(maxY);y+=tstep){const X=px(y);
    s+=`<line x1="${X.toFixed(1)}" y1="${baseY-4}" x2="${X.toFixed(1)}" y2="${baseY+4}" stroke="var(--ink3)"/>`;
    s+=`<text x="${X.toFixed(1)}" y="${baseY+19}" text-anchor="middle" font-size="10" fill="var(--ink3)">${y===0?"año 0":y}</text>`;}
  markers.forEach((m,i)=>{const X=px(m.years),col=MC[i]||"var(--brick)";
    const nameY=baseY-16-lane[i]*laneH;
    const anc=X<76?"start":X>(W-76)?"end":"middle"; const lx=anc==="start"?mL:anc==="end"?(W-mR):X;
    s+=`<line x1="${X.toFixed(1)}" y1="${(baseY-5).toFixed(1)}" x2="${X.toFixed(1)}" y2="${(nameY+4).toFixed(1)}" stroke="${col}" stroke-width=".8" opacity=".45"/>`;
    s+=`<circle cx="${X.toFixed(1)}" cy="${baseY}" r="5.5" fill="${col}"/>`;
    s+=`<text x="${lx.toFixed(1)}" y="${nameY.toFixed(1)}" text-anchor="${anc}" font-family="Archivo" font-weight="700" font-size="11" fill="var(--ink)">${esc(m.label)}</text>`;
    s+=`<text x="${lx.toFixed(1)}" y="${(nameY+11).toFixed(1)}" text-anchor="${anc}" font-size="9" fill="var(--ink3)">${m.sub!=null?esc(m.sub):m.years.toFixed(1)+" años · n="+m.n}</text>`;});
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
  return `<div class="card"><h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:""}${svg}${opt.note?`<div class="note">${opt.note}</div>`:""}</div>`;
}

function tabResumen(rows){
  const n=rows.length;          // conteo real de encuestas (siempre crudo)
  const nw=wsum(rows);          // denominador para porcentajes (ponderado si WMODE)
  const barrios=new Set(rows.map(r=>r.barrio)).size;
  const partidos=new Set(rows.map(r=>r.partido)).size;
  const def=countBy(rows,r=>r.deficit);
  const defTot=(def["Cualitativo"]||0)+(def["Cuantitativo"]||0);
  const kp=kpi(n,"Encuestas válidas","(acepta la encuesta)")
    +kpi(barrios,"Barrios alcanzados","de 334 titulares")
    +kpi(partidos,"Partidos","")
    +kpi(pct(defTot,nw)+"%","Con déficit habitacional","multidimensional","alert")
    +kpi(pct(def["Sin déficit"]||0,nw)+"%","Sin déficit","","good");
  // déficit por estrato (stacked)
  const er=EORDER.filter(e=>F.estrato.has(e)).map(e=>{const sub=rows.filter(r=>r.estrato===e);const d=countBy(sub,r=>r.deficit);
    return {label:ELBL[e],sub:sub.length+" enc.",segs:[{v:d["Sin déficit"]||0,color:DEFCOL["Sin déficit"],label:"Sin déficit"},{v:d["Cualitativo"]||0,color:DEFCOL["Cualitativo"],label:"Cualitativo"},{v:d["Cuantitativo"]||0,color:DEFCOL["Cuantitativo"],label:"Cuantitativo"}]};});
  const estCard=stackCard("Déficit habitacional por estrato","Composición cuali/cuanti sobre encuestas válidas de cada estrato",er,
    [{color:DEFCOL["Sin déficit"],label:"Sin déficit"},{color:DEFCOL["Cualitativo"],label:"Cualitativo"},{color:DEFCOL["Cuantitativo"],label:"Cuantitativo"}]);
  // villa vs asentamiento
  const t=countBy(rows,r=>r.tipo);
  const tipoCard=barChart("Villa vs. Asentamiento","Distribución de encuestas válidas",
    [{label:"Asentamiento",value:t["Asentamiento"]||0,color:"var(--moss2)"},{label:"Villa",value:t["Villa"]||0,color:"var(--slate2)"}],{pctOf:nw});
  return `<div class="kpis">${kp}</div>${estCard}<div class="grid g2">${tipoCard}${tabResumenCarga(rows)}</div>`;
}
function tabResumenCarga(rows){
  const by={};rows.forEach(r=>{by[r.barrio]=(by[r.barrio]||0)+1;}); // conteo crudo: es una métrica operativa (encuestas reales por barrio)

    top.map(([b,v])=>({label:b,value:v,color:"var(--slate3)"})),{note:"Meta operativa de referencia: 15 encuestas por barrio."});
}

function tabDeficit(rows){

    +kpi(pct(def["Cualitativo"]||0,n)+"%","Cualitativo","recuperable / saneam. / hacin.")
    +kpi(pct(def["Cuantitativo"]||0,n)+"%","Cuantitativo","irrecuperable / cohabitación","alert")

  const compCard=barChart("Componentes del déficit","Encuestas afectadas por cada dimensión (una vivienda puede sumar varias)",
    Object.entries(comp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({label:k,value:v,color:["Materialidad irrecuperable","Cohabitación"].includes(k)?"var(--brick)":"var(--gold)"})),
    {pctOf:n,note:'<b>Cuantitativo</b> (brick): materialidad irrecuperable o cohabitación. <b>Cualitativo</b> (gold): materialidad recuperable, saneamiento inadecuado o hacinamiento crítico.'});
  // CALMAT
  const cmc=countBy(rows,r=>r.calmat);
  const calCard=barChart("Materialidad (CALMAT)","Matriz pared × piso × techo → categorías I–V",
    ["I","II","III","IV","V"].map(c=>({label:"CALMAT "+c,value:cmc[c]||0,sub:c==="I"?"adecuada":["II","III"].includes(c)?"recuperable":"irrecuperable",
      color:c==="I"?"var(--moss)":["II","III"].includes(c)?"var(--gold)":"var(--brick)"})),{pctOf:n});
  // superposición
  const nd=countBy(rows.filter(r=>r.deficit!=="Sin déficit"),r=>r.ndims);

}

  const seguros=(t["Título"]||0)+(t["Boleto compra-venta"]||0);

    +kpi(t["Trámite iniciado"]||0,"Trámite en curso","regularización iniciada");

  const tblE=`<div class="card"><h3>Resumen por estrato</h3><div class="sub">Déficit multidimensional dentro de cada estrato (los % por estrato no cambian con la ponderación)</div><table class="map">${head}${body}</table></div>`;

  return tblE+tblB;

  const ratePts=[];
  if(accAsc.length){const y0=Math.max(1985,accAsc[0]);
    for(let y=y0;y<=2026;y++){const pres=accAsc.filter(a=>a<=y).length; if(pres<30)continue; ratePts.push([y, Math.round((totC[y]||0)/pres*100)]);}}
  const c2rate=svgLineChart("Intensidad de obra por año (obras por 100 hogares presentes)","Obras de cada año divididas por los hogares que YA habían accedido a su terreno ese año. Saca el efecto de que con el tiempo hay más hogares, así que una caída acá es una baja REAL de actividad, no 'menos hogares'.",
    [{name:"Obras / 100 hogares",color:"var(--moss)",pts:ratePts,w:2.4},{name:"Mediana móvil 3 años",color:"var(--slate)",pts:movMedian(ratePts,3),w:1.8,dash:true,noLabel:true}],
    {xMin:1985,xMax:2026,legend:true,labels:false,vlines:VLINES,shade:SHADE_TRUNC,
     note:`Acá se leen las crisis: las caídas en <b>2001-04</b> y <b>2024-25</b> son bajas reales de la intensidad de obra, no efecto de la cantidad de hogares. Zona gris 2025-26: dato parcial. Sólo años con ≥30 hogares presentes.`});
  // 2b — RITMO: % de hogares que hizo al menos una obra, por años desde el acceso (controla exposición), por grupo
  const MAXE=25, NOW=2026;
  function ritmoSerie(sub){
    const num=new Array(MAXE+1).fill(0), exp=new Array(MAXE+1).fill(0);
    sub.forEach(r=>{if(r.antig_anio==null)return; const win=NOW-r.antig_anio; if(win<0)return;
      for(let e=0;e<=Math.min(MAXE,win);e++) exp[e]++;
      const yrs=new Set(); HITOS_ALL.forEach(([k])=>{const y=r.hitos[k]; if(y==null)return; const e=y-r.antig_anio; if(e>=0&&e<=MAXE) yrs.add(e);});
      yrs.forEach(e=>num[e]++);});
    const pts=[]; for(let e=0;e<=MAXE;e++){ if(exp[e]>=20) pts.push([e, Math.round(num[e]/exp[e]*1000)/10]); }
    return pts;
  }
  const ritmoAll=ritmoSerie(rows), serCero=ritmoSerie(rows.filter(r=>r.origen==="De cero")), serAlgo=ritmoSerie(rows.filter(r=>r.origen==="Ya tenía algo"));
  const pkA=ritmoAll.reduce((a,p)=>p[1]>a[1]?p:a,[0,0]);
  const ritmoSeries=[{name:"Todos",color:"var(--ink3)",pts:ritmoAll,w:1.5,dash:true,noLabel:true}];
  if(serCero.length) ritmoSeries.push({name:"De cero (terreno pelado)",color:"var(--brick)",pts:serCero,w:2.6});
  if(serAlgo.length) ritmoSeries.push({name:"Ya tenía algo",color:"var(--slate)",pts:serAlgo,w:2.6});
  const c2b=svgLineChart("Ritmo de obra desde el acceso al terreno","% de hogares que hizo al menos una obra en cada año desde que accedió al terreno (año 0 = acceso), separado por cómo estaba el terreno al llegar. Cada punto se divide por los hogares que ya llevaban esos años, así que no lo infla la cantidad de hogares recientes.",
    ritmoSeries,
    {xMin:0,xMax:MAXE,labels:false,legend:true,
     note:`Se lee directo: en el año 0, cerca del ${pkA[1]}% de los hogares hace alguna obra; después baja año a año. Comparación clave: los que arrancaron <b>de cero</b> vs. los que <b>ya tenían algo</b>. Sólo tramos con ≥20 hogares expuestos.`});
  // 2c — curva acumulada: % de la obra total ya hecha a los X años del acceso
  const numE2=new Array(MAXE+1).fill(0);
  rows.forEach(r=>{if(r.antig_anio==null)return; HITOS_ALL.forEach(([k])=>{const y=r.hitos[k]; if(y==null)return; const e=y-r.antig_anio; if(e>=0&&e<=MAXE) numE2[e]++;});});
  const totE=numE2.reduce((a,b)=>a+b,0)||1;
  const cumPts=[]; let acc=0; for(let e=0;e<=MAXE;e++){acc+=numE2[e]; cumPts.push([e, Math.round(acc/totE*1000)/10]);}
  const e50=cumPts.find(p=>p[1]>=50), e80=cumPts.find(p=>p[1]>=80);
  const c2cum=svgLineChart("Obra acumulada desde el acceso al terreno","% de toda la obra fechada que ya está hecha, según los años desde el acceso (curva de avance).",
    [{name:"% acumulado de obra",color:"var(--moss)",pts:cumPts,w:2.6}],
    {xMin:0,xMax:MAXE,yMax:100,labels:false,legend:false,
     note:`La mitad de toda la obra fechada ocurre en los primeros <b>${e50?e50[0]:"—"} años</b> y el 80% dentro de los <b>${e80?e80[0]:"—"} años</b>. La curva se aplana: la obra tardía es mucho más lenta.`});
  // 3 — acceso al terreno por año (mediana móvil o quinquenios)
  const accC={};rows.forEach(r=>{if(r.antig_anio!=null)accC[r.antig_anio]=(accC[r.antig_anio]||0)+1;});
  const nAcc=Object.values(accC).reduce((a,b)=>a+b,0);
  const heapAcc=heapIndex(accC);
  let c3;
  if(QMODE){
    c3=svgLineChart("Acceso al terreno por quinquenio","Hogares según el año de acceso al terreno, en tramos de 5 años.",
      [{name:"Hogares",color:"var(--slate)",pts:quinqPts(accC),w:2.6}],
      {xMin:1960,xMax:2026,labels:true,legend:false,shade:SHADE_TRUNC,note:`${nAcc} hogares con año de acceso declarado.`});
  } else {
    c3=svgLineChart("Acceso al terreno por año","Hogares según el año declarado de acceso al terreno, con mediana móvil 3 años.",
      [{name:"Hogares",color:"var(--slate)",pts:Object.entries(accC).map(([y,n])=>[+y,n]),w:2.2},{name:"Mediana móvil 3 años",color:"var(--brick2)",pts:movMedian(densify(accC),3),w:1.8,dash:true,noLabel:true}],
      {xMin:1960,xMax:2026,labels:true,shade:SHADE_TRUNC,note:`${nAcc} hogares con año de acceso declarado. <b>Heaping:</b> ${heapAcc}% en años terminados en 0/5 (esperable ~20%). <b>Ojo (sesgo de supervivencia):</b> sólo encuestamos a quienes siguen viviendo ahí, así que las llegadas más viejas pueden estar sub-representadas.`});
  }
  // ---- líneas de tiempo acumuladas (año 0 = acceso al terreno) ----
  const el=[];rows.forEach(r=>{if(r.antig_anio!=null&&r.mudanza_anio!=null)el.push(r.mudanza_anio-r.antig_anio);});
  const n=el.length;
  const mean=n?el.reduce((a,b)=>a+b,0)/n:0;
  const sr=[...el].sort((a,b)=>a-b); const median=n?(sr[Math.floor((n-1)/2)]+sr[Math.ceil((n-1)/2)])/2:0;
  const neg=el.filter(e=>e<0).length, zero=el.filter(e=>e===0).length;
  // mediana + completitud por hito de obra
  const mfmt=v=>Number.isInteger(v)?v:Math.round(v*10)/10;
  const medf=arr=>{if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);return (s[Math.floor((s.length-1)/2)]+s[Math.ceil((s.length-1)/2)])/2;};
  const obraStats=TL_HITOS.map(h=>{
    const e=[]; rows.forEach(r=>{const v=obraElapsed(r,h.key); if(v!=null)e.push(v);});
    const ya=rows.filter(r=>r.obrasTL[h.key].estado==="Ya estaba al llegar").length;
    const hizo=rows.filter(r=>r.obrasTL[h.key].estado==="Lo hicimos").length;
    const noa=rows.filter(r=>r.obrasTL[h.key].estado==="Todavía no").length;
    const reached=ya+hizo, answered=reached+noa;
    return {h,mean:e.length?e.reduce((a,b)=>a+b,0)/e.length:0,median:medf(e),n:e.length,ya,hizo,noa,reached,answered,pct:answered?Math.round(reached/answered*100):0};
  });
  function buildTL(upto,title,note){
    const mk=[{label:"Acceso al terreno",years:0,sub:"año de acceso (t₀)",n:n},
              {label:"Mudanza",years:Math.max(0,mean),sub:"mediana "+mfmt(median)+" a · n="+n,n:n}];
    let mx=Math.max(3,mean+1);
    for(let i=0;i<upto;i++){const s=obraStats[i]; mk.push({label:s.h.label,years:Math.max(0,s.mean),sub:"mediana "+mfmt(s.median)+" a · llegó "+s.pct+"%",n:s.n}); mx=Math.max(mx,s.mean+1);}
    return svgTimeline(title,"Cada punto se ubica en el tiempo promedio; la etiqueta muestra la mediana (más robusta) y el % que llegó al hito. Año 0 = acceso al terreno.",mk,{max:mx,note});
  }
  const tl=buildTL(0,"Línea de tiempo · acceso al terreno + mudanza",
    `Años hasta mudarse: mediana <b>${mfmt(median)}</b> (media ${mean.toFixed(1)}). De ${n} hogares, ${zero} se mudaron el mismo año del acceso (${pct(zero,n)}%) y ${neg} declararon mudanza ANTES del acceso al terreno.`);
  // distribución años hasta mudarse — cada valor exacto por separado
  const order=["< 0 (antes)"]; for(let y=0;y<=15;y++)order.push(String(y)); order.push("+15");
  const db={}; order.forEach(k=>db[k]=0);
  el.forEach(e=>{if(e<0)db["< 0 (antes)"]++;else if(e>15)db["+15"]++;else db[String(e)]++;});
  const distData=order.filter(k=>db[k]>0).map(k=>({label:k==="0"?"0 (mismo año)":k,value:db[k],color:k==="< 0 (antes)"?"var(--ink3)":k==="0"?"var(--moss)":"var(--slate2)"}));
  const dist=barChart("Años entre acceso al terreno y mudanza","Cantidad de hogares por cada valor exacto de años hasta mudarse (año de mudanza − año de acceso)",distData,{pctOf:n,note:"Cada barra es un año exacto. La mayoría se muda el mismo año del acceso (0); los negativos declararon mudanza ANTES del año de acceso al terreno."});
  // embudo de completitud — cuántos llegan a cada hito (la atrición que las medianas no muestran)
  const funnelRows=obraStats.map(s=>({label:s.h.label, sub:`llegó ${s.reached} · todavía no ${s.noa} · ${s.pct}%`, segs:[{v:s.reached,color:"var(--moss)",label:"Llegó"},{v:s.noa,color:"var(--brick)",label:"Todavía no"}]}));
  const funnel=stackCard("Embudo de completitud · ¿cuántos llegan a cada hito?","Sobre los hogares que respondieron cada hito: proporción que ya lo logró vs. todavía no. Acá está la atrición que las medianas (calculadas solo sobre quienes llegaron) no muestran.",funnelRows,[{color:"var(--moss)",label:"Llegó"},{color:"var(--brick)",label:"Todavía no"}],"La caída se dispara en terminaciones y sobre todo en ampliación: la mayoría no amplió, aun con muchos años en el terreno. Por eso la mediana de ampliación describe a una minoría.");
  // una línea de tiempo acumulada por cada hito que se suma
  const tlCum=obraStats.map((s,i)=>buildTL(i+1,"Línea de tiempo · + "+s.h.label,
    `${s.h.label}: mediana <b>${mfmt(s.median)}</b> años entre quienes llegaron (n=${s.n}); <b>llegó el ${s.pct}%</b> (${s.noa} todavía no). Media ${s.mean.toFixed(1)}.`)).join("");
  const banner=WMODE?`<div class="err" style="background:#F3EEE2;border-color:var(--gold);color:#8a6a1e;margin-bottom:18px">⚖ <b>Esta pestaña se muestra sin ponderar</b>, aun con la ponderación activada. El análisis temporal (medianas de años hasta cada hito) requiere medianas ponderadas y queda para el informe calibrado; los conteos por año son crudos.</div>`:"";
  return banner+c1+c2+c2rate+c2b+c2cum+c3+tl+dist+funnel+tlCum;
}

   +`<div class="frow"><span class="flabel">Tipo</span>${["Asentamiento","Villa"].map(t=>{const nn=ALL.filter(r=>r.tipo===t).length;return `<span class="chip t" data-f="tipo" data-v="${t}" data-on="${F.tipo.has(t)?1:0}"><span class="dot"></span>${t}<span class="n">${nn}</span></span>`;}).join("")}</div>`
   +`<div class="frow"><span class="flabel" title="Cómo estaba el terreno/vivienda cuando el hogar lo adquirió">Origen</span>${ORIGENES.map(o=>{const nn=ALL.filter(r=>r.origen===o).length;return `<span class="chip t" data-f="origen" data-v="${esc(o)}" data-on="${F.origen.has(o)?1:0}"><span class="dot"></span>${o==="De cero"?"De cero (pelado)":o==="Ya tenía algo"?"Ya tenía algo":"s/d"}<span class="n">${nn}</span></span>`;}).join("")}</div>`
   +`<div class="frow"><span class="flabel" title="Década de creación del barrio (RENABAP)">Antigüedad</span>${ANTIGF.map(v=>{const nn=ALL.filter(r=>r.antig===v).length; if(!nn&&v==="s/d")return ""; const sl={"Menos de 5":"−5 años","Hasta 15 años":"≤15","Hasta 25 años":"≤25","Entre 25 y 45":"25–45","Más de 45 años":"+45 años","s/d":"s/d"}[v]||v; return `<span class="chip t" data-f="antig" data-v="${esc(v)}" data-on="${F.antig.has(v)?1:0}"><span class="dot"></span>${sl}<span class="n">${nn}</span></span>`;}).join("")}</div>`
   +`<div class="frow"><span class="flabel" title="Familias aproximadas por barrio (agrupado)">Tamaño</span>${TAMANOF.map(v=>{const nn=ALL.filter(r=>r.tam===v).length; if(!nn&&v==="s/d")return ""; const sl={"menos de 51 familias":"<51","Entre 51 y 200 familias":"51–200","201 a 500 familias":"201–500","501 a 1500 familias":"501–1500","1500 o más familias":"1500+","s/d":"s/d"}[v]||v; return `<span class="chip t" data-f="tam" data-v="${esc(v)}" data-on="${F.tam.has(v)?1:0}"><span class="dot"></span>${sl}<span class="n">${nn}</span></span>`;}).join("")}</div>`
   +`<div class="frow"><span class="flabel">Partido</span><select id="selPartido"><option value="__all__">Todos</option>${[...new Set(ALL.map(r=>r.partido))].sort().map(p=>`<option value="${esc(p)}" ${F.partido===p?"selected":""}>${esc(p)}</option>`).join("")}</select></div>`;
  fc.innerHTML=filtHTML;
  const ff=document.getElementById("floatFilters"); if(ff)ff.innerHTML=filtHTML;
  function wireFilters(cont){cont.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{const f=c.dataset.f,v=c.dataset.v;const set=F[f];set.has(v)?set.delete(v):set.add(v);if(set.size===0)set.add(v);render();});const sel=cont.querySelector("select");if(sel)sel.onchange=e=>{F.partido=e.target.value;render();};}
  wireFilters(fc); if(ff)wireFilters(ff);
  // tabs
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<span class="tab" data-k="${k}" data-on="${TAB===k?1:0}">${l}</span>`).join("");
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{TAB=t.dataset.k;render();});
  // body
  const app=document.getElementById("app");
  if(rows.length===0){app.innerHTML=`<div class="err">No hay encuestas válidas en la selección actual.</div>`;return;}
  app.innerHTML = TAB==="presentacion"?tabPresentacion(rows):TAB==="deficit"?tabDeficit(rows):TAB==="terreno"?tabTerreno(rows):TAB==="tenencia"?tabTenencia(rows):TAB==="progresividad"?tabProgresividad(rows):tabPago();
  if(TAB==="progresividad"){document.querySelectorAll(".cohorte-chip").forEach(c=>c.onclick=()=>{F.cohorte=c.dataset.c;render();});
    document.querySelectorAll(".qmode-btn").forEach(b=>b.onclick=()=>{QMODE=b.dataset.q==="1";render();});}
  document.getElementById("src").textContent=SRC;
  const snap=document.getElementById("snap"); snap.textContent=SNAP; snap.className="snap"+(SRC.startsWith("Sheet")?" live":"");
  syncPondBtn();
}

// ---------- ingesta de datos ----------
function ingest(records, src){
  COLS = records.length?Object.keys(records[0]):[];
  const valid=records.filter(r=>r["encuesta_responde"]==="Acepta la encuesta");
  ALL = valid.map(buildRecord).filter(Boolean);
  // --- pesos de post-estratificación por estrato macro ---
  // w_i = (N_h / n_h) · (n / N), normalizado para que Σ w_i = cantidad de encuestas válidas.
  // n_h = respuestas realizadas en el estrato; N_h = hogares del universo (Tabla 2.1).
  const nh={}; ALL.forEach(r=>{nh[r.estrato]=(nh[r.estrato]||0)+1;});
  let Nsum=0, nsum=0; EORDER.forEach(e=>{if(nh[e]){Nsum+=NH[e]; nsum+=nh[e];}});
  ALL.forEach(r=>{ r.w = (nh[r.estrato] && NH[r.estrato] && Nsum>0) ? (NH[r.estrato]/nh[r.estrato])*(nsum/Nsum) : 1; });
  SRC=src; SNAP=`${ALL.length} válidas · ${records.length} filas · ${new Date().toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}`;
  F.estrato=new Set(EORDER);F.tipo=new Set(["Asentamiento","Villa"]);F.origen=new Set(ORIGENES);F.antig=new Set(ANTIGF);F.tam=new Set(TAMANOF);F.partido="__all__";F.cohorte="all";
  render();
}
function fetchSheet(){
  document.getElementById("app").innerHTML=`<div class="loading">Conectando con el Google Sheet en vivo…</div>`;
  const cb="__gviz_"+Date.now();
  let done=false;
  window[cb]=function(resp){done=true;try{
    const t=resp.table, cols=t.cols.map(c=>c.label||c.id);
    const recs=t.rows.map(row=>{const o={};row.c.forEach((cell,i)=>{o[cols[i]]=cell?cell.v:null;});return o;});
    ingest(recs,"Sheet vivo");
  }catch(e){showErr(e.message);} cleanup();};
  function cleanup(){delete window[cb];s.remove();}
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&sheet=${encodeURIComponent(SHEET_TAB)}&headers=1`;
  const s=document.createElement("script");s.src=url;
  s.onerror=()=>{if(!done){showErr("no se pudo cargar el Sheet");cleanup();}};
  document.head.appendChild(s);
  setTimeout(()=>{if(!done)showErr("tiempo de espera agotado");},12000);
}
function showErr(msg){document.getElementById("app").innerHTML=`<div class="err"><b>No se pudo leer el Sheet en vivo</b> (${esc(msg)}).<br>Verificá que el Google Sheet esté compartido como <b>"Cualquiera con el enlace: Lector"</b> y que exista la pestaña <b>${esc(SHEET_TAB)}</b>. Mientras tanto podés usar <b>⤒ Cargar archivo</b> con el export .xlsx/.csv de Kobo.</div>`;}
function loadFile(file){
  const rd=new FileReader();
  rd.onload=e=>{try{
    const wb=XLSX.read(e.target.result,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames.find(n=>n===SHEET_TAB)||wb.SheetNames[0]];
    const recs=XLSX.utils.sheet_to_json(ws,{defval:null});
    ingest(recs,"Archivo: "+file.name);
  }catch(err){showErr("archivo inválido: "+err.message);}};
  rd.readAsArrayBuffer(file);
}
function syncPondBtn(){const b=document.getElementById("btnPond");if(!b)return;b.textContent=WMODE?"⚖ Ponderado por estrato":"⚖ Datos crudos";b.className="btn"+(WMODE?" on":"");}
document.getElementById("btnPond").onclick=()=>{WMODE=!WMODE;syncPondBtn();render();};
document.getElementById("btnRefresh").onclick=fetchSheet;
document.getElementById("btnFile").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);};
// botón flotante de filtros: aparece al desplazarse y despliega el mismo panel
(function initFab(){
  const fab=document.getElementById("fabFilters"),panel=document.getElementById("floatPanel"),cls=document.getElementById("floatClose"),bar=document.getElementById("filters");
  const close=()=>panel.classList.remove("show");
  fab.onclick=()=>panel.classList.toggle("show");
  cls.onclick=close;
  window.addEventListener("scroll",()=>{const past=bar?bar.getBoundingClientRect().bottom<4:window.scrollY>160;fab.classList.toggle("show",past);if(!past)close();},{passive:true});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});
})();
fetchSheet();
</script></body></html>
